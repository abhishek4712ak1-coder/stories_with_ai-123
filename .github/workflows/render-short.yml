name: Generate and Render Hindi Short

on:
    workflow_dispatch:
    schedule:
        - cron: "50 3 * * *"

permissions:
    contents: read

jobs:
    render:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install rendering dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core
                  python -m pip install --upgrade pip
                  python -m pip install pillow

            - name: Generate and render Hindi story
              env:
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
              run: |
                  mkdir -p output

                  cat > render.py <<'PY'
                  import os
                  import json
                  import time
                  import wave
                  import urllib.request
                  import urllib.error
                  import subprocess
                  import html
                  import re
                  from io import BytesIO
                  from urllib.parse import urlencode, quote

                  from pathlib import Path
                  from PIL import Image, ImageDraw, ImageFont, ImageOps

                  # --------------------------------------------------
                  # CONFIGURATION
                  # --------------------------------------------------

                  API_KEY = os.environ.get("GEMINI_API_KEY")

                  if not API_KEY:
                      raise RuntimeError("GEMINI_API_KEY secret is missing.")

                  MODEL = "gemini-3.8-flash"

                  W = 720
                  H = 1280

                  output = Path("output")
                  output.mkdir(exist_ok=True)

                  palette = [
                      (24, 35, 65),
                      (42, 48, 78),
                      (55, 42, 75),
                      (32, 55, 72),
                      (58, 43, 57),
                      (25, 48, 60),
                  ]

                  # --------------------------------------------------
                  # FONTS
                  # --------------------------------------------------

                  regular_font_path = (
                      "/usr/share/fonts/truetype/noto/"
                      "NotoSansDevanagari-Regular.ttf"
                  )

                  bold_font_path = (
                      "/usr/share/fonts/truetype/noto/"
                      "NotoSansDevanagari-Bold.ttf"
                  )

                  if not Path(regular_font_path).exists():
                      raise RuntimeError("Hindi regular font not found.")

                  if not Path(bold_font_path).exists():
                      raise RuntimeError("Hindi bold font not found.")

                  small_font = ImageFont.truetype(
                      regular_font_path, 25
                  )

                  caption_font = ImageFont.truetype(
                      bold_font_path, 34
                  )

                  # --------------------------------------------------
                  # GEMINI STORY GENERATION WITH RETRIES
                  # --------------------------------------------------

                  def generate_story():

                      print("Generating Hindi story with Gemini...")

                      prompt = """
                      Create an original emotional and engaging Hindi animated
                      story for a YouTube Short.

                      Return ONLY valid JSON with this exact structure:

                      {
                        "title": "Hindi title",
                        "description": "Short Hindi description",
                        "hashtags": ["HindiStory", "AIStory", "Shorts"],
                        "scenes": [
                          {
                            "narration": "Hindi narration for this scene",
                            "caption": "Short Hindi caption",
                            "visual_prompt": "Short English visual description"
                          }
                        ]
                      }

                      Requirements:
                      - Exactly 6 scenes.
                      - Story must be original.
                      - Narration must be natural Hindi.
                      - Each scene should have approximately 2 sentences.
                      - Captions should be short.
                      - Story must have a strong opening.
                      - Story must have a satisfying and surprising ending.
                      - Suitable for a 45 to 60 second YouTube Short.
                      - Keep the story suitable for all ages.
                      """

                      url = (
                          "https://generativelanguage.googleapis.com/"
                          f"v1beta/models/{MODEL}:generateContent"
                          f"?key={API_KEY}"
                      )

                      payload = {
                          "contents": [
                              {
                                  "parts": [
                                      {"text": prompt}
                                  ]
                              }
                          ],
                          "generationConfig": {
                              "temperature": 0.9,
                              "responseMimeType": "application/json"
                          }
                      }

                      for attempt in range(1, 6):

                          request = urllib.request.Request(
                              url,
                              data=json.dumps(payload).encode("utf-8"),
                              headers={
                                  "Content-Type": "application/json"
                              },
                              method="POST"
                          )

                          try:
                              print(
                                  f"Gemini API attempt {attempt}/5..."
                              )

                              with urllib.request.urlopen(
                                  request, timeout=180
                              ) as response:

                                  result = json.loads(
                                      response.read().decode("utf-8")
                                  )

                              content = (
                                  result["candidates"][0]
                                  ["content"]["parts"][0]["text"]
                              )

                              story = json.loads(content)

                              scenes = story.get("scenes", [])

                              if len(scenes) != 6:
                                  raise RuntimeError(
                                      "Expected exactly 6 scenes, "
                                      f"received {len(scenes)}."
                                  )

                              for index, scene in enumerate(scenes):

                                  for key in (
                                      "narration",
                                      "caption",
                                      "visual_prompt"
                                  ):

                                      value = scene.get(key)

                                      if (
                                          not isinstance(value, str)
                                          or not value.strip()
                                      ):
                                          raise RuntimeError(
                                              f"Scene {index + 1} "
                                              f"has missing {key}."
                                          )

                              if not isinstance(story.get("title"), str):
                                  raise RuntimeError(
                                      "Story title is missing."
                                  )

                              print(
                                  "Hindi story generated successfully."
                              )

                              return story

                          except urllib.error.HTTPError as error:

                              details = error.read().decode(
                                  "utf-8", errors="replace"
                              )

                              if error.code not in (
                                  429, 500, 502, 503, 504
                              ):
                                  raise RuntimeError(
                                      f"Gemini API HTTP {error.code}: "
                                      f"{details}"
                                  ) from error

                              if attempt == 5:
                                  raise RuntimeError(
                                      "Gemini remained unavailable after "
                                      f"5 attempts. HTTP {error.code}: "
                                      f"{details}"
                                  ) from error

                              wait = 15 * (2 ** (attempt - 1))

                              print(
                                  f"Gemini HTTP {error.code}. "
                                  f"Retrying in {wait} seconds..."
                              )

                              time.sleep(wait)

                          except (
                              urllib.error.URLError,
                              TimeoutError
                          ) as error:

                              if attempt == 5:
                                  raise RuntimeError(
                                      "Gemini network failure after "
                                      f"5 attempts: {error}"
                                  ) from error

                              wait = 15 * (2 ** (attempt - 1))

                              print(
                                  f"Network error: {error}. "
                                  f"Retrying in {wait} seconds..."
                              )

                              time.sleep(wait)

                      raise RuntimeError(
                          "Story generation failed unexpectedly."
                      )

                  # --------------------------------------------------
                  # TEXT WRAPPING
                  # --------------------------------------------------

                  def wrap_text(draw, text, font, max_width):

                      words = str(text).split()
                      lines = []
                      current = ""

                      for word in words:

                          candidate = f"{current} {word}".strip()

                          width = draw.textbbox(
                              (0, 0),
                              candidate,
                              font=font
                          )[2]

                          if width > max_width and current:
                              lines.append(current)
                              current = word
                          else:
                              current = candidate

                      if current:
                          lines.append(current)

                      return lines

                  # --------------------------------------------------
                  # CREATE SCENE IMAGES
                  # --------------------------------------------------

                  image_credits = []

                  def find_commons_image(scene):

                      search_text = (
                          str(scene.get("visual_prompt", "")) + " " +
                          str(scene.get("caption", ""))
                      ).strip()[:180]

                      params = {
                          "action": "query",
                          "generator": "search",
                          "gsrsearch": search_text,
                          "gsrnamespace": 6,
                          "gsrlimit": 8,
                          "prop": "imageinfo",
                          "iiprop": "url|extmetadata",
                          "iiurlwidth": 1200,
                          "format": "json",
                          "formatversion": 2
                      }

                      api_url = (
                          "https://commons.wikimedia.org/w/api.php?"
                          + urlencode(params)
                      )

                      headers = {
                          "User-Agent": (
                              "StoriesWithAI/1.0 "
                              "(https://github.com/abhishek4712ak1-coder/"
                              "stories_with_ai-123)"
                          )
                      }

                      try:

                          request = urllib.request.Request(
                              api_url,
                              headers=headers
                          )

                          with urllib.request.urlopen(
                              request,
                              timeout=25
                          ) as response:
                              data = json.loads(response.read().decode("utf-8"))

                          pages = data.get("query", {}).get("pages", [])

                          for page in pages:

                              image_info = page.get("imageinfo", [])

                              if not image_info:
                                  continue

                              info = image_info[0]
                              metadata = info.get("extmetadata", {})

                              def meta_value(key):

                                  value = metadata.get(key, {}).get("value", "")

                                  value = re.sub(
                                      r"<[^>]+>",
                                      "",
                                      str(value)
                                  )

                                  return html.unescape(value).strip()

                              license_name = meta_value("LicenseShortName")
                              license_lower = license_name.lower()

                              is_public_domain = (
                                  "public domain" in license_lower
                                  or "cc0" in license_lower
                              )

                              is_cc_by = (
                                  "cc by" in license_lower
                                  and "cc by-sa" not in license_lower
                                  and "cc by-nd" not in license_lower
                                  and "cc by-nc" not in license_lower
                              )

                              if not (is_public_domain or is_cc_by):
                                  continue

                              thumbnail_url = info.get("thumburl")

                              if not thumbnail_url:
                                  continue

                              image_request = urllib.request.Request(
                                  thumbnail_url,
                                  headers=headers
                              )

                              with urllib.request.urlopen(
                                  image_request,
                                  timeout=30
                              ) as response:
                                  image_data = response.read()

                              photo = Image.open(
                                  BytesIO(image_data)
                              ).convert("RGB")

                              title = page.get("title", "Wikimedia image")

                              source_url = (
                                  page.get("canonicalurl")
                                  or "https://commons.wikimedia.org/wiki/"
                                  + quote(title.replace(" ", "_"))
                              )

                              credit = {
                                  "title": title,
                                  "artist": meta_value("Artist") or "Creator not listed",
                                  "license": license_name,
                                  "license_url": meta_value("LicenseUrl"),
                                  "source": source_url
                              }

                              print("Wikimedia image found:", title)

                              return photo, credit

                      except Exception as error:

                          print(
                              "Wikimedia image search failed:",
                              str(error)[:250]
                          )

                      return None, None


                  def create_scene_image(scene, index):

                      photo, credit = find_commons_image(scene)

                      if photo is not None:

                          im = ImageOps.fit(
                              photo,
                              (W, H),
                              method=Image.Resampling.LANCZOS
                          ).convert("RGBA")

                          draw = ImageDraw.Draw(im, "RGBA")

                          # Top branding panel.
                          draw.rounded_rectangle(
                              (28, 28, W - 28, 155),
                              radius=25,
                              fill=(0, 0, 0, 155)
                          )

                          draw.text(
                              (55, 52),
                              "STORIES WITH AI",
                              font=small_font,
                              fill="white"
                          )

                          draw.text(
                              (55, 100),
                              f"SCENE {index + 1}/6",
                              font=small_font,
                              fill=(255, 220, 140)
                          )

                          # Hindi caption panel.
                          draw.rounded_rectangle(
                              (35, 850, W - 35, 1190),
                              radius=28,
                              fill=(0, 0, 0, 190)
                          )

                          caption_lines = wrap_text(
                              draw,
                              scene.get("caption", ""),
                              caption_font,
                              W - 110
                          )[:4]

                          y = 895

                          for line in caption_lines:

                              draw.text(
                                  (55, y),
                                  line,
                                  font=caption_font,
                                  fill="white",
                                  stroke_width=1,
                                  stroke_fill=(0, 0, 0)
                              )

                              y += 65

                          image_credits.append(credit)

                      else:

                          # Original fallback design.
                          im = Image.new(
                              "RGB",
                              (W, H),
                              palette[index % len(palette)]
                          )

                          draw = ImageDraw.Draw(im)

                          draw.ellipse(
                              (440, 100, 800, 460),
                              fill=(255, 194, 96)
                          )

                          draw.ellipse(
                              (-160, 700, 240, 1100),
                              fill=(104, 158, 198)
                          )

                          draw.rounded_rectangle(
                              (35, 35, W - 35, H - 35),
                              radius=30,
                              outline=(255, 255, 255),
                              width=3
                          )

                          draw.text(
                              (55, 70),
                              "STORIES WITH AI",
                              font=small_font,
                              fill="white"
                          )

                          draw.text(
                              (55, 130),
                              f"SCENE {index + 1}",
                              font=small_font,
                              fill=(255, 220, 140)
                          )

                          visual_lines = wrap_text(
                              draw,
                              scene.get("visual_prompt", ""),
                              small_font,
                              W - 110
                          )[:5]

                          y = 260

                          for line in visual_lines:

                              draw.text(
                                  (55, y),
                                  line,
                                  font=small_font,
                                  fill="white"
                              )

                              y += 40

                          draw.rounded_rectangle(
                              (40, 790, W - 40, 1150),
                              radius=25,
                              fill=(15, 20, 35)
                          )

                          caption_lines = wrap_text(
                              draw,
                              scene.get("caption", ""),
                              caption_font,
                              W - 110
                          )[:5]

                          y = 850

                          for line in caption_lines:

                              draw.text(
                                  (55, y),
                                  line,
                                  font=caption_font,
                                  fill="white"
                              )

                              y += 65

                      image_path = output / f"scene_{index:02d}.png"

                      im.convert("RGB").save(
                          image_path,
                          quality=95
                      )

                      return str(image_path)

                  # HINDI NARRATION
                  # --------------------------------------------------

                  def create_narration(scene, index):

                      wav_path = output / f"voice_{index:02d}.wav"

                      subprocess.run(
                          [
                              "espeak-ng",
                              "-v", "hi",
                              "-s", "145",
                              "-w", str(wav_path),
                              scene["narration"]
                          ],
                          check=True
                      )

                      if not wav_path.exists() or wav_path.stat().st_size == 0:
                          raise RuntimeError(
                              f"Narration failed for scene {index + 1}."
                          )

                      return str(wav_path)

                  # --------------------------------------------------
                  # COMBINE AUDIO
                  # --------------------------------------------------

                  def combine_audio(wav_files):

                      if not wav_files:
                          raise RuntimeError(
                              "No narration files were generated."
                          )

                      with wave.open(wav_files[0], "rb") as first:
                          params = first.getparams()

                      with wave.open(
                          str(output / "narration.wav"), "wb"
                      ) as out:

                          out.setparams(params)

                          for wav_file in wav_files:

                              with wave.open(wav_file, "rb") as inp:

                                  if inp.getparams()[:3] != params[:3]:
                                      raise RuntimeError(
                                          "Voice audio formats differ "
                                          "between scenes."
                                      )

                                  out.writeframes(
                                      inp.readframes(inp.getnframes())
                                  )

                  # --------------------------------------------------
                  # RENDER VIDEO
                  # --------------------------------------------------

                  def render_video(image_files, wav_files):

                      clips = []

                      for index, wav_file in enumerate(wav_files):

                          clip = output / f"clip_{index:02d}.mp4"

                          subprocess.run(
                              [
                                  "ffmpeg",
                                  "-y",
                                  "-loglevel", "error",
                                  "-loop", "1",
                                  "-framerate", "25",
                                  "-i", image_files[index],
                                  "-i", wav_file,
                                  "-vf", "scale=720:1280,format=yuv420p",
                                  "-c:v", "libx264",
                                  "-preset", "ultrafast",
                                  "-tune", "stillimage",
                                  "-c:a", "aac",
                                  "-b:a", "96k",
                                  "-shortest",
                                  "-movflags", "+faststart",
                                  str(clip)
                              ],
                              check=True
                          )

                          clips.append(clip)

                      concat_file = output / "concat.txt"

                      concat_file.write_text(
                          "".join(
                              f"file '{clip.resolve()}'\n"
                              for clip in clips
                          ),
                          encoding="utf-8"
                      )

                      final_video = (
                          output / "stories-with-ai-short.mp4"
                      )

                      subprocess.run(
                          [
                              "ffmpeg",
                              "-y",
                              "-loglevel", "error",
                              "-f", "concat",
                              "-safe", "0",
                              "-i", str(concat_file),
                              "-c:v", "libx264",
                              "-preset", "ultrafast",
                              "-c:a", "aac",
                              "-movflags", "+faststart",
                              str(final_video)
                          ],
                          check=True
                      )

                      if (
                          not final_video.exists()
                          or final_video.stat().st_size == 0
                      ):
                          raise RuntimeError(
                              "Final video was not generated."
                          )

                      return final_video

                  # --------------------------------------------------
                  # SAVE YOUTUBE METADATA
                  # --------------------------------------------------

                  def save_metadata(story):

                      hashtags = story.get("hashtags", [])

                      if not isinstance(hashtags, list):
                          hashtags = []

                      description = str(story.get("description", ""))

                      if image_credits:

                          credit_lines = []

                          for index, credit in enumerate(image_credits, 1):

                              credit_lines.append(
                                  f"{index}. {credit['title']}\n"
                                  f"   Creator: {credit['artist']}\n"
                                  f"   License: {credit['license']}\n"
                                  f"   Source: {credit['source']}\n"
                                  f"   License details: {credit['license_url']}"
                              )

                          description += (
                              "\n\nImage credits:\n"
                              + "\n\n".join(credit_lines)
                              + "\n\nImages sourced from Wikimedia Commons. "
                                "Images have been cropped and captioned for this video."
                          )

                      metadata = (
                          f"TITLE\n"
                          f"{story.get('title', 'Hindi AI Story')}\n\n"
                          f"DESCRIPTION\n"
                          f"{description}\n\n"
                          f"HASHTAGS\n"
                          f"{' '.join(str(tag) for tag in hashtags)}\n"
                      )

                      (
                          output / "upload-metadata.txt"
                      ).write_text(
                          metadata,
                          encoding="utf-8"
                      )

                  # MAIN
                  # --------------------------------------------------

                  def main():

                      print("Starting Hindi Shorts automation...")

                      story = generate_story()

                      image_files = []
                      wav_files = []

                      for index, scene in enumerate(story["scenes"]):

                          print(
                              f"Processing scene {index + 1}/6..."
                          )

                          image_files.append(
                              create_scene_image(scene, index)
                          )

                          wav_files.append(
                              create_narration(scene, index)
                          )

                      print("Combining narration...")

                      combine_audio(wav_files)

                      print("Rendering final vertical video...")

                      video = render_video(
                          image_files,
                          wav_files
                      )

                      save_metadata(story)

                      print(f"SUCCESS: {video}")

                      print(
                          "SUCCESS: output/upload-metadata.txt"
                      )

                  if __name__ == "__main__":
                      main()

                  PY

                  python -m py_compile render.py
                  python render.py

            - name: Verify generated video
              run: |
                  test -s output/stories-with-ai-short.mp4
                  test -s output/upload-metadata.txt

                  ffprobe -v error \
                    -show_entries format=duration \
                    -of default=noprint_wrappers=1:nokey=1 \
                    output/stories-with-ai-short.mp4

            - name: Upload rendered video artifact
              uses: actions/upload-artifact@v4
              with:
                  name: stories-with-ai-rendered-short
                  path: |
                      output/stories-with-ai-short.mp4
                      output/upload-metadata.txt
                  retention-days: 7
