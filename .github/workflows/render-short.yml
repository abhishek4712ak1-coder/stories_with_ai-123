name: Generate and Render Hindi Short

on:
    workflow_dispatch:
    schedule:
        - cron: "50 3 * * *"

permissions:
    contents: read

jobs:
    render:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install rendering dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core fonts-dejavu-core libraqm-dev libfreetype-dev libharfbuzz-dev libfribidi-dev libjpeg-dev zlib1g-dev
                  python -m pip install --upgrade pip
                  python -m pip install --no-binary=Pillow pillow

            - name: Generate and render Hindi story
              env:
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
              run: |
                  mkdir -p output

                  cat > render.py <<'PY'
                  import os
                  import json
                  import time
                  import wave
                  import urllib.request
                  import urllib.error
                  import subprocess
                  import html
                  import re
                  from io import BytesIO
                  from urllib.parse import urlencode, quote

                  from pathlib import Path
                  from PIL import Image, ImageDraw, ImageFont, ImageOps, features

                  # --------------------------------------------------
                  # CONFIGURATION
                  # --------------------------------------------------

                  API_KEY = os.environ.get("GEMINI_API_KEY")

                  if not API_KEY:
                      raise RuntimeError("GEMINI_API_KEY secret is missing.")

                  MODEL = "gemini-3.8-flash"

                  W = 720
                  H = 1280

                  output = Path("output")
                  output.mkdir(exist_ok=True)

                  palette = [
                      (24, 35, 65),
                      (42, 48, 78),
                      (55, 42, 75),
                      (32, 55, 72),
                      (58, 43, 57),
                      (25, 48, 60),
                  ]

                  # --------------------------------------------------
                  # FONTS
                  # --------------------------------------------------

                  regular_font_path = (
                      "/usr/share/fonts/truetype/noto/"
                      "NotoSansDevanagari-Regular.ttf"
                  )

                  bold_font_path = (
                      "/usr/share/fonts/truetype/noto/"
                      "NotoSansDevanagari-Bold.ttf"
                  )

                  latin_font_path = (
                      "/usr/share/fonts/truetype/dejavu/"
                      "DejaVuSans.ttf"
                  )

                  latin_bold_font_path = (
                      "/usr/share/fonts/truetype/dejavu/"
                      "DejaVuSans-Bold.ttf"
                  )

                  for font_path in (
                      regular_font_path,
                      bold_font_path,
                      latin_font_path,
                      latin_bold_font_path
                  ):
                      if not Path(font_path).exists():
                          raise RuntimeError(
                              f"Required font not found: {font_path}"
                          )

                  if not features.check("raqm"):
                      raise RuntimeError(
                          "Pillow RAQM support is required for correct "
                          "Hindi text shaping."
                      )

                  brand_font = ImageFont.truetype(
                      latin_bold_font_path,
                      27,
                      layout_engine=ImageFont.Layout.RAQM
                  )

                  caption_font = ImageFont.truetype(
                      bold_font_path,
                      38,
                      layout_engine=ImageFont.Layout.RAQM
                  )

                  visual_font = ImageFont.truetype(
                      latin_font_path,
                      25,
                      layout_engine=ImageFont.Layout.RAQM
                  )

                  # --------------------------------------------------
                  # GEMINI STORY GENERATION WITH RETRIES
                  # --------------------------------------------------

                  def generate_story():

                      print("Generating Hindi story with Gemini...")

                      prompt = """
                      Create an original emotional and engaging Hindi animated
                      story for a YouTube Short.

                      Return ONLY valid JSON with this exact structure:

                      {
                        "title": "Hindi title",
                        "description": "Short Hindi description",
                        "hashtags": ["HindiStory", "AIStory", "Shorts"],
                        "scenes": [
                          {
                            "narration": "Hindi narration for this scene",
                            "caption": "Short Hindi caption",
                            "visual_prompt": "Short English visual description"
                          }
                        ]
                      }

                      Requirements:
                      - Exactly 6 scenes in chronological story order.
                      - Story must be original and emotionally engaging.
                      - Narration must be natural, conversational Hindi.
                      - Each scene should have 1 or 2 concise sentences.
                      - Total narration should be approximately 90 to 110 Hindi words.
                      - Captions must be short Hindi phrases, ideally 3 to 7 words.
                      - Every visual_prompt MUST be written in English.
                      - Every visual_prompt must describe a specific, searchable photograph.
                      - Include the main subject, visible action, setting and important objects.
                      - Describe realistic Indian people, places and environments when appropriate.
                      - Maintain the same character appearance across all six scenes.
                      - Prefer cinematic, photorealistic documentary-style imagery.
                      - Do not request abstract shapes, geometric backgrounds, posters, text or illustrations.
                      - Do not include written words, signs, subtitles or watermarks in visual_prompt.
                      - Story must have a strong opening and a satisfying surprising ending.
                      - Suitable for a 45 to 60 second YouTube Short.
                      - Keep the story suitable for all ages.
                      """

                      url = (
                          "https://generativelanguage.googleapis.com/"
                          f"v1beta/models/{MODEL}:generateContent"
                          f"?key={API_KEY}"
                      )

                      payload = {
                          "contents": [
                              {
                                  "parts": [
                                      {"text": prompt}
                                  ]
                              }
                          ],
                          "generationConfig": {
                              "temperature": 0.9,
                              "responseMimeType": "application/json"
                          }
                      }

                      for attempt in range(1, 6):

                          request = urllib.request.Request(
                              url,
                              data=json.dumps(payload).encode("utf-8"),
                              headers={
                                  "Content-Type": "application/json"
                              },
                              method="POST"
                          )

                          try:
                              print(
                                  f"Gemini API attempt {attempt}/5..."
                              )

                              with urllib.request.urlopen(
                                  request, timeout=180
                              ) as response:

                                  result = json.loads(
                                      response.read().decode("utf-8")
                                  )

                              content = (
                                  result["candidates"][0]
                                  ["content"]["parts"][0]["text"]
                              )

                              story = json.loads(content)

                              scenes = story.get("scenes", [])

                              if len(scenes) != 6:
                                  raise RuntimeError(
                                      "Expected exactly 6 scenes, "
                                      f"received {len(scenes)}."
                                  )

                              for index, scene in enumerate(scenes):

                                  for key in (
                                      "narration",
                                      "caption",
                                      "visual_prompt"
                                  ):

                                      value = scene.get(key)

                                      if (
                                          not isinstance(value, str)
                                          or not value.strip()
                                      ):
                                          raise RuntimeError(
                                              f"Scene {index + 1} "
                                              f"has missing {key}."
                                          )

                              if not isinstance(story.get("title"), str):
                                  raise RuntimeError(
                                      "Story title is missing."
                                  )

                              print(
                                  "Hindi story generated successfully."
                              )

                              return story

                          except urllib.error.HTTPError as error:

                              details = error.read().decode(
                                  "utf-8", errors="replace"
                              )

                              if error.code not in (
                                  429, 500, 502, 503, 504
                              ):
                                  raise RuntimeError(
                                      f"Gemini API HTTP {error.code}: "
                                      f"{details}"
                                  ) from error

                              if attempt == 5:
                                  raise RuntimeError(
                                      "Gemini remained unavailable after "
                                      f"5 attempts. HTTP {error.code}: "
                                      f"{details}"
                                  ) from error

                              wait = 15 * (2 ** (attempt - 1))

                              print(
                                  f"Gemini HTTP {error.code}. "
                                  f"Retrying in {wait} seconds..."
                              )

                              time.sleep(wait)

                          except (
                              urllib.error.URLError,
                              TimeoutError
                          ) as error:

                              if attempt == 5:
                                  raise RuntimeError(
                                      "Gemini network failure after "
                                      f"5 attempts: {error}"
                                  ) from error

                              wait = 15 * (2 ** (attempt - 1))

                              print(
                                  f"Network error: {error}. "
                                  f"Retrying in {wait} seconds..."
                              )

                              time.sleep(wait)

                      raise RuntimeError(
                          "Story generation failed unexpectedly."
                      )

                  # --------------------------------------------------
                  # TEXT WRAPPING
                  # --------------------------------------------------

                  def wrap_text(draw, text, font, max_width):

                      words = str(text).split()
                      lines = []
                      current = ""

                      for word in words:

                          candidate = f"{current} {word}".strip()

                          width = draw.textbbox(
                              (0, 0),
                              candidate,
                              font=font
                          )[2]

                          if width > max_width and current:
                              lines.append(current)
                              current = word
                          else:
                              current = candidate

                      if current:
                          lines.append(current)

                      return lines

                  # --------------------------------------------------
                  # CREATE SCENE IMAGES
                  # --------------------------------------------------

                  image_credits = []

                  def find_commons_image(scene):

                      raw_prompt = str(scene.get("visual_prompt", ""))

                      search_text = re.sub(
                          r"[^a-zA-Z0-9 ]",
                          " ",
                          raw_prompt
                      )

                      stopwords = {
                          "the", "and", "with", "from", "that",
                          "this", "photorealistic", "cinematic",
                          "documentary", "style", "realistic",
                          "photo", "photograph"
                      }

                      words = [
                          word for word in search_text.split()
                          if len(word) > 2
                          and word.lower() not in stopwords
                      ]

                      queries = list(dict.fromkeys([
                          " ".join(words[:7]),
                          " ".join(words[:4])
                      ]))

                      headers = {
                          "User-Agent": (
                              "StoriesWithAI/1.0 "
                              "(https://github.com/abhishek4712ak1-coder/"
                              "stories_with_ai-123)"
                          )
                      }

                      for search_query in queries:

                          if not search_query:
                              continue

                          print(
                              "Searching Wikimedia Commons:",
                              search_query
                          )

                          params = {
                              "action": "query",
                              "generator": "search",
                              "gsrsearch": search_query,
                              "gsrnamespace": 6,
                              "gsrlimit": 15,
                              "prop": "imageinfo",
                              "iiprop": "url|extmetadata",
                              "iiurlwidth": 1200,
                              "format": "json",
                              "formatversion": 2
                          }

                          api_url = (
                              "https://commons.wikimedia.org/w/api.php?"
                              + urlencode(params)
                          )

                          try:
                              request = urllib.request.Request(
                                  api_url,
                                  headers=headers
                              )

                              with urllib.request.urlopen(
                                  request,
                                  timeout=30
                              ) as response:
                                  data = json.loads(
                                      response.read().decode("utf-8")
                                  )

                          except Exception as error:
                              print(
                                  "Commons search request failed:",
                                  str(error)[:200]
                              )
                              continue

                          pages = data.get(
                              "query", {}
                          ).get("pages", [])

                          print(
                              "Wikimedia candidates:",
                              len(pages)
                          )

                          for page in pages:

                              try:
                                  image_info = page.get("imageinfo", [])

                                  if not image_info:
                                      continue

                                  info = image_info[0]
                                  metadata = info.get(
                                      "extmetadata", {}
                                  )

                                  def meta_value(key):
                                      value = metadata.get(
                                          key, {}
                                      ).get("value", "")

                                      value = re.sub(
                                          r"<[^>]+>",
                                          "",
                                          str(value)
                                      )

                                      return html.unescape(
                                          value
                                      ).strip()

                                  license_name = meta_value(
                                      "LicenseShortName"
                                  )

                                  license_lower = license_name.lower()

                                  is_public_domain = (
                                      "public domain" in license_lower
                                      or "cc0" in license_lower
                                  )

                                  is_cc_by = (
                                      "cc by" in license_lower
                                      and "cc by-sa" not in license_lower
                                      and "cc by-nd" not in license_lower
                                      and "cc by-nc" not in license_lower
                                  )

                                  if not (
                                      is_public_domain or is_cc_by
                                  ):
                                      print(
                                          "Skipping licence:",
                                          license_name or "unknown"
                                      )
                                      continue

                                  thumbnail_url = info.get("thumburl")

                                  if not thumbnail_url:
                                      continue

                                  image_request = urllib.request.Request(
                                      thumbnail_url,
                                      headers=headers
                                  )

                                  with urllib.request.urlopen(
                                      image_request,
                                      timeout=30
                                  ) as response:
                                      image_data = response.read()

                                  photo = Image.open(
                                      BytesIO(image_data)
                                  ).convert("RGB")

                                  if (
                                      photo.width < 500
                                      or photo.height < 500
                                  ):
                                      print("Skipping low-resolution image.")
                                      continue

                                  title = page.get(
                                      "title",
                                      "Wikimedia image"
                                  )

                                  source_url = (
                                      page.get("canonicalurl")
                                      or "https://commons.wikimedia.org/wiki/"
                                      + quote(title.replace(" ", "_"))
                                  )

                                  credit = {
                                      "title": title,
                                      "artist": (
                                          meta_value("Artist")
                                          or "Creator not listed"
                                      ),
                                      "license": license_name,
                                      "license_url": meta_value("LicenseUrl"),
                                      "source": source_url
                                  }

                                  print(
                                      "Usable Wikimedia photograph:",
                                      title
                                  )

                                  return photo, credit

                              except Exception as error:
                                  print(
                                      "Skipping unusable candidate:",
                                      str(error)[:180]
                                  )
                                  continue

                      print(
                          "No suitable licensed photograph found "
                          "for this scene."
                      )

                      return None, None


                  def create_scene_image(scene, index):

                      photo, credit = find_commons_image(scene)

                      if photo is None:
                          raise RuntimeError(
                              f"No suitable licensed photograph found "
                              f"for scene {index + 1}. Stopping render "
                              "instead of creating a geometric fallback."
                          )

                      im = ImageOps.fit(
                          photo,
                          (W, H),
                          method=Image.Resampling.LANCZOS
                      ).convert("RGBA")

                      draw = ImageDraw.Draw(im, "RGBA")

                      # Top branding panel.
                      draw.rounded_rectangle(
                          (28, 28, W - 28, 145),
                          radius=24,
                          fill=(0, 0, 0, 165)
                      )

                      draw.text(
                          (52, 48),
                          "STORIES WITH AI",
                          font=brand_font,
                          fill=(255, 255, 255, 255)
                      )

                      draw.text(
                          (52, 91),
                          f"SCENE {index + 1}/6",
                          font=visual_font,
                          fill=(255, 220, 140, 255)
                      )

                      # Caption panel at the bottom.
                      caption = str(scene.get("caption", "")).strip()

                      caption_lines = wrap_text(
                          draw,
                          caption,
                          caption_font,
                          W - 120
                      )

                      if not caption_lines or len(caption_lines) > 4:
                          raise RuntimeError(
                              f"Caption for scene {index + 1} "
                              "is empty or too long."
                          )

                      line_height = 58
                      panel_height = max(
                          190,
                          90 + len(caption_lines) * line_height
                      )

                      panel_top = H - panel_height - 45

                      draw.rounded_rectangle(
                          (30, panel_top, W - 30, H - 40),
                          radius=28,
                          fill=(0, 0, 0, 205)
                      )

                      total_text_height = (
                          len(caption_lines) * line_height
                      )

                      y = panel_top + (
                          panel_height - total_text_height
                      ) // 2

                      for line in caption_lines:

                          bounds = draw.textbbox(
                              (0, 0),
                              line,
                              font=caption_font
                          )

                          line_width = bounds[2] - bounds[0]
                          x = (W - line_width) // 2 - bounds[0]

                          draw.text(
                              (x, y),
                              line,
                              font=caption_font,
                              fill=(255, 255, 255, 255),
                              stroke_width=1,
                              stroke_fill=(0, 0, 0, 255)
                          )

                          y += line_height

                      image_credits.append(credit)

                      image_path = output / f"scene_{index:02d}.png"

                      im.convert("RGB").save(
                          image_path,
                          quality=95
                      )

                      print(
                          f"Scene {index + 1}: photograph and "
                          "Hindi caption rendered."
                      )

                      return str(image_path)

                  # HINDI NARRATION
                  # --------------------------------------------------

                  def create_narration(scene, index):

                      wav_path = output / f"voice_{index:02d}.wav"

                      subprocess.run(
                          [
                              "espeak-ng",
                              "-v", "hi",
                              "-s", "145",
                              "-w", str(wav_path),
                              scene["narration"]
                          ],
                          check=True
                      )

                      if not wav_path.exists() or wav_path.stat().st_size == 0:
                          raise RuntimeError(
                              f"Narration failed for scene {index + 1}."
                          )

                      return str(wav_path)

                  # --------------------------------------------------
                  # COMBINE AUDIO
                  # --------------------------------------------------

                  def combine_audio(wav_files):

                      if not wav_files:
                          raise RuntimeError(
                              "No narration files were generated."
                          )

                      with wave.open(wav_files[0], "rb") as first:
                          params = first.getparams()

                      with wave.open(
                          str(output / "narration.wav"), "wb"
                      ) as out:

                          out.setparams(params)

                          for wav_file in wav_files:

                              with wave.open(wav_file, "rb") as inp:

                                  if inp.getparams()[:3] != params[:3]:
                                      raise RuntimeError(
                                          "Voice audio formats differ "
                                          "between scenes."
                                      )

                                  out.writeframes(
                                      inp.readframes(inp.getnframes())
                                  )

                  # --------------------------------------------------
                  # RENDER VIDEO
                  # --------------------------------------------------

                  def render_video(image_files, wav_files):

                      import math

                      if not image_files or not wav_files:
                          raise RuntimeError(
                              "Images or narration files are missing."
                          )

                      if len(image_files) != len(wav_files):
                          raise RuntimeError(
                              "Image and narration counts do not match."
                          )

                      narration = output / "narration.wav"

                      if not narration.exists():
                          raise RuntimeError(
                              "Combined narration.wav was not generated."
                          )

                      durations = []

                      for wav_file in wav_files:

                          with wave.open(str(wav_file), "rb") as audio:
                              duration = (
                                  audio.getnframes() / audio.getframerate()
                              )

                          if duration <= 0:
                              raise RuntimeError(
                                  f"Invalid narration duration: {wav_file}"
                              )

                          durations.append(duration)

                      command = ["ffmpeg", "-y", "-loglevel", "error"]

                      for index, image_file in enumerate(image_files):

                          duration = durations[index]

                          if index == len(image_files) - 1:
                              duration += 0.25

                          duration = math.ceil(duration * 25) / 25

                          command.extend([
                              "-loop", "1",
                              "-framerate", "25",
                              "-t", f"{duration:.3f}",
                              "-i", str(image_file)
                          ])

                      audio_input_index = len(image_files)

                      command.extend(["-i", str(narration)])

                      filters = []

                      for index in range(len(image_files)):

                          filters.append(
                              f"[{index}:v]"
                              "scale=720:1280:"
                              "force_original_aspect_ratio=increase,"
                              "crop=720:1280,"
                              "setsar=1,"
                              "fps=25,"
                              "format=yuv420p"
                              f"[v{index}]"
                          )

                      video_inputs = "".join(
                          f"[v{index}]"
                          for index in range(len(image_files))
                      )

                      filters.append(
                          video_inputs
                          + f"concat=n={len(image_files)}:v=1:a=0[v]"
                      )

                      final_video = (
                          output / "stories-with-ai-short.mp4"
                      )

                      command.extend([
                          "-filter_complex", ";".join(filters),
                          "-map", "[v]",
                          "-map", f"{audio_input_index}:a",
                          "-c:v", "libx264",
                          "-preset", "ultrafast",
                          "-tune", "stillimage",
                          "-pix_fmt", "yuv420p",
                          "-c:a", "aac",
                          "-b:a", "128k",
                          "-shortest",
                          "-movflags", "+faststart",
                          str(final_video)
                      ])

                      subprocess.run(command, check=True)

                      if (
                          not final_video.exists()
                          or final_video.stat().st_size == 0
                      ):
                          raise RuntimeError(
                              "Final video was not generated."
                          )

                      return final_video

                  def save_metadata(story):

                      hashtags = story.get("hashtags", [])

                      if not isinstance(hashtags, list):
                          hashtags = []

                      description = str(story.get("description", ""))

                      if image_credits:

                          credit_lines = []

                          for index, credit in enumerate(image_credits, 1):

                              credit_lines.append(
                                  f"{index}. {credit['title']}\n"
                                  f"   Creator: {credit['artist']}\n"
                                  f"   License: {credit['license']}\n"
                                  f"   Source: {credit['source']}\n"
                                  f"   License details: {credit['license_url']}"
                              )

                          description += (
                              "\n\nImage credits:\n"
                              + "\n\n".join(credit_lines)
                              + "\n\nImages sourced from Wikimedia Commons. "
                                "Images have been cropped and captioned for this video."
                          )

                      metadata = (
                          f"TITLE\n"
                          f"{story.get('title', 'Hindi AI Story')}\n\n"
                          f"DESCRIPTION\n"
                          f"{description}\n\n"
                          f"HASHTAGS\n"
                          f"{' '.join(str(tag) for tag in hashtags)}\n"
                      )

                      (
                          output / "upload-metadata.txt"
                      ).write_text(
                          metadata,
                          encoding="utf-8"
                      )

                  # MAIN
                  # --------------------------------------------------

                  def main():

                      print("Starting Hindi Shorts automation...")

                      story = generate_story()

                      image_files = []
                      wav_files = []

                      for index, scene in enumerate(story["scenes"]):

                          print(
                              f"Processing scene {index + 1}/6..."
                          )

                          image_files.append(
                              create_scene_image(scene, index)
                          )

                          wav_files.append(
                              create_narration(scene, index)
                          )

                      print("Combining narration...")

                      combine_audio(wav_files)

                      print("Rendering final vertical video...")

                      video = render_video(
                          image_files,
                          wav_files
                      )

                      save_metadata(story)

                      print(f"SUCCESS: {video}")

                      print(
                          "SUCCESS: output/upload-metadata.txt"
                      )

                  if __name__ == "__main__":
                      main()

                  PY

                  python -m py_compile render.py
                  python render.py

            - name: Verify generated video
              run: |
                  test -s output/stories-with-ai-short.mp4
                  test -s output/upload-metadata.txt

                  ffprobe -v error \
                    -show_entries format=duration \
                    -of default=noprint_wrappers=1:nokey=1 \
                    output/stories-with-ai-short.mp4

            - name: Upload rendered video artifact
              uses: actions/upload-artifact@v4
              with:
                  name: stories-with-ai-rendered-short
                  path: |
                      output/stories-with-ai-short.mp4
                      output/upload-metadata.txt
                  retention-days: 7
